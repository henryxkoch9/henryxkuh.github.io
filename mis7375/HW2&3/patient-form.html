<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>HP Health Patient Registration</title>
        <link rel="stylesheet" href="style.css">
        <script src="patient-form.js" defer></script>
    </head>
    <body>
        <div id="header">
            <table width="100%">
                <tbody>
                    <tr>
                        <td>
                            <img id="logo" src="hphealthlogo.png" alt="HP Health">
                        </td>
                        <td valign="top">HitPoints Health</td>
                        <td valign="bottom" align="right">Today's date: <span id="today"></span></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <hr>
        <div id="body">
            <form id="patient-form" action="thanks.html" method="get" novalidate>
                <table class="form">
                    <tbody>
                        <tr class="form">
                            <th class="form" colspan="3">Patient Registration</th>
                        </tr>

                        <tr class="form">
                            <td align="right">
                                <label for="firstname">First,</label>
                                <label for="middleinit">MI,</label>
                                <label for="lastname">& Last Name</label>
                            </td>
                            <td>
                                <input type="text" size="25" maxlength="30" id="firstname" name="firstname" required pattern="^[A-Za-z' \-]{1,30}$" title="Enter a first name using letters, apostrophes, or dashes only." placeholder="First Name">
                                <input type="text" size="1" maxlength="1" id="middleinit" name="middleinit" pattern="^[A-Za-z]?$" title="Optional: enter a single letter for your middle initial." placeholder="MI">
                                <input type="text" size="20" maxlength="30" id="lastname" name="lastname" required pattern="^[A-Za-z][A-Za-z' \-]*[0-9]{0,5}$" title="Enter a last name using letters, spaces, apostrophes, dashes, or a suffix such as 3rd." placeholder="Last Name">
                                <span id="name_text"></span>
                                <br><br>
                            </td>
                        </tr>

                        <tr class="form">
                            <td align="right">
                                <label for="social_security">Social Security #</label>
                            </td>
                            <td>
                                <input type="password" size="9" maxlength="9" id="social_security" name="social_security" required pattern="^[0-9]{9}$" title="Enter your Social Security number in the format 123456789." placeholder="SSN Number">
                                <span id="ssn_text"></span>
                                <br><br>
                            </td>
                        </tr>

                        <tr class="form">
                            <td align="right">
                                <label for="dob">Date of Birth</label>
                            </td>
                            <td>
                                <input type="date" id="dob" name="dob" required title="Select your date of birth. Dates in the future or older than 120 years are not allowed.">
                                <span id="dob_text"></span>
                                <br><br>
                            </td>
                        </tr>

                        <tr>
                            <td align="right">
                                <label for="gender">Gender</label>
                            </td>
                            <td>
                                <label><input id="gender-male" name="gender" type="radio" value="male" required> Male</label>
                                <label><input id="gender-female" name="gender" type="radio" value="female"> Female</label>
                                <br><br>
                            </td>
                        </tr>

                        <tr class="form">
                            <td align="right">
                                <label for="email">Email Address</label>
                            </td>
                            <td>
                                <input type="email" size="30" maxlength="50" id="email" name="email" required pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$" title="Enter a valid email address such as name@example.com." placeholder="Email Address">
                                <span id="email_text"></span>
                                <br><br>
                            </td>
                        </tr>

                        <tr class="form">
                            <td align="right">
                                <label for="addr1">Address Line 1</label>
                            </td>
                            <td>
                                <input type="text" size="20" minlength="4" maxlength="30" id="addr1" name="addr1" required pattern="^.{2,30}$" title="Enter your street address (2 to 30 characters)." placeholder="Physical Address">
                                <span id="addr1_text"></span>
                            </td>
                        </tr>

                        <tr class="form">
                            <td align="right">
                                <label for="addr2">Address Line 2</label>
                            </td>
                            <td>
                                <input type="text" size="20" maxlength="30" id="addr2" name="addr2" pattern="^$|^.{2,30}$" title="Optional. If provided, use 2 to 30 characters for a second address line." placeholder="Additional Address Info">
                                <span id="addr2_text"></span>
                                <br><br>
                            </td>
                        </tr>

                        <tr class="form">
                            <td align="right">
                                <label for="city">City,</label>
                                <label for="state">State,</label>
                                <label for="zip">& Zip Code</label>
                            </td>
                            <td>
                                <input type="text" size="10" maxlength="25" id="city" name="city" required pattern="^[A-Za-z .'-]{2,25}$" title="Enter your city name using letters, spaces, apostrophes, dashes, or periods." placeholder="City">
                                <select id="state" name="state" required title="Select your state or territory.">
                                    <option value="">State</option>
                                    <option value="AL">Alabama</option>
                                    <option value="AK">Alaska</option>
                                    <option value="AZ">Arizona</option>
                                    <option value="AR">Arkansas</option>
                                    <option value="CA">California</option>
                                    <option value="CO">Colorado</option>
                                    <option value="CT">Connecticut</option>
                                    <option value="DE">Delaware</option>
                                    <option value="DC">District Of Columbia</option>
                                    <option value="FL">Florida</option>
                                    <option value="GA">Georgia</option>
                                    <option value="HI">Hawaii</option>
                                    <option value="ID">Idaho</option>
                                    <option value="IL">Illinois</option>
                                    <option value="IN">Indiana</option>
                                    <option value="IA">Iowa</option>
                                    <option value="KS">Kansas</option>
                                    <option value="KY">Kentucky</option>
                                    <option value="LA">Louisiana</option>
                                    <option value="ME">Maine</option>
                                    <option value="MD">Maryland</option>
                                    <option value="MA">Massachusetts</option>
                                    <option value="MI">Michigan</option>
                                    <option value="MN">Minnesota</option>
                                    <option value="MS">Mississippi</option>
                                    <option value="MO">Missouri</option>
                                    <option value="MT">Montana</option>
                                    <option value="NE">Nebraska</option>
                                    <option value="NV">Nevada</option>
                                    <option value="NH">New Hampshire</option>
                                    <option value="NJ">New Jersey</option>
                                    <option value="NM">New Mexico</option>
                                    <option value="NY">New York</option>
                                    <option value="NC">North Carolina</option>
                                    <option value="ND">North Dakota</option>
                                    <option value="OH">Ohio</option>
                                    <option value="OK">Oklahoma</option>
                                    <option value="OR">Oregon</option>
                                    <option value="PA">Pennsylvania</option>
                                    <option value="PR">Puerto Rico</option>
                                    <option value="RI">Rhode Island</option>
                                    <option value="SC">South Carolina</option>
                                    <option value="SD">South Dakota</option>
                                    <option value="TN">Tennessee</option>
                                    <option value="TX">Texas</option>
                                    <option value="UT">Utah</option>
                                    <option value="VT">Vermont</option>
                                    <option value="VA">Virginia</option>
                                    <option value="WA">Washington</option>
                                    <option value="WV">West Virginia</option>
                                    <option value="WI">Wisconsin</option>
                                    <option value="WY">Wyoming</option>
                                </select>
                                <input type="text" pattern="^\d{5}(-\d{4})?$" size="10" maxlength="10" id="zip" name="zip" required title="Enter a 5-digit ZIP code or ZIP + 4 code." placeholder="Zip Code">
                                <span id="City_text"><span id="State_text"><span id="Zip_text"></span></span></span>
                                <br><br>
                            </td>
                        </tr>

                        <tr class="form">
                            <td align="right">
                                <label for="phone">Phone Number</label>
                            </td>
                            <td>
                                <input type="text" size="13" maxlength="13" id="phone" name="phone" required pattern="^\d{3}-\d{3}-\d{4}$" title="Enter your phone number in the format 000-000-0000." placeholder="000-000-0000">
                                <span id="phone_text"></span>
                                <br><br>
                            </td>
                        </tr>

                        <tr>
                            <td align="right">
                                <label for="conditions">Have you been diagnosed with any of these?</label>
                            </td>
                            <td>
                                <fieldset class="choice-group check-grid">
                                    <legend class="visually-hidden">Select all conditions that apply</legend>
                                    <label><input name="conditions" type="checkbox" value="Asthma"> Asthma</label>
                                    <label><input name="conditions" type="checkbox" value="Diabetes"> Diabetes</label>
                                    <label><input name="conditions" type="checkbox" value="Heart disease"> Heart disease</label>
                                    <label><input name="conditions" type="checkbox" value="High blood pressure"> High blood pressure</label>
                                    <label><input name="conditions" type="checkbox" value="Migraines"> Migraines</label>
                                    <label><input name="conditions" type="checkbox" value="Anemia"> Anemia</label>
                                </fieldset>
                                <br><br>
                            </td>
                        </tr>

                        <tr>
                            <td align="right">
                                <label for="vaccinated">Are your vaccinations up to date?</label>
                            </td>
                            <td>
                                <label><input id="vaccinated-yes" name="vaccinated" type="radio" value="Yes" required> Yes</label>
                                <label><input id="vaccinated-no" name="vaccinated" type="radio" value="No"> No</label>
                                <label><input id="vaccinated-unsure" name="vaccinated" type="radio" value="Unsure"> Unsure</label>
                                <br><br>
                            </td>
                        </tr>

                        <tr>
                            <td align="right">
                                <label for="insurance">Do you have health insurance?</label>
                            </td>
                            <td>
                                <label><input name="insurance" type="radio" value="Yes" required> Yes</label>
                                <label><input name="insurance" type="radio" value="No"> No</label>
                                <br><br>
                            </td>
                        </tr>

                        <tr>
                            <td align="right">
                                <label for="healthRating">How would you rate your health today?</label>
                            </td>
                            <td>
                                <div class="range-field">
                                    <span>1 · Poor</span>
                                    <div class="range-control">
                                        <input id="healthRating" name="healthRating" type="range" min="1" max="10" value="5" title="Slide to choose your overall health rating from 1 to 10.">
                                        <output id="healthRatingValue" for="healthRating">5</output>
                                    </div>
                                    <span>10 · Excellent</span>
                                </div>
                                <br><br>
                            </td>
                        </tr>

                        <tr>
                            <td align="right">
                                <label for="symptoms">Described Symptoms</label>
                            </td>
                            <td>
                                <textarea id="symptoms" name="symptoms" rows="4" maxlength="500" title="Optional: describe any symptoms in up to 500 characters." placeholder="Describe any symptoms (optional)"></textarea>
                            </td>
                        </tr>

                        <tr>
                            <td align="right">
                                <label for="userId">User ID</label>
                            </td>
                            <td>
                                <input type="text" size="35" id="userId" name="userId" minlength="5" maxlength="20" pattern="^[A-Za-z][A-Za-z0-9_-]{4,19}$" autocomplete="username" aria-describedby="userId-hint" required placeholder="5 to 20 characters; start with a letter." title="User ID must be 5 to 20 characters, start with a letter, and contain only letters, numbers, underscores, or dashes.">
                                <span id="userId_text"></span>
                            </td>
                        </tr>

                        <tr>
                            <td align="right">
                                <label for="password">Password</label>
                            </td>
                            <td>
                                <input type="password" size="35" id="password" name="password" minlength="8" maxlength="64" autocomplete="new-password" required placeholder="Minimum 8 characters" title="Password must be 8 to 30 characters with at least one uppercase letter, one lowercase letter, one digit, and one special character." pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,30}">
                                <span id="password_text"></span>
                            </td>
                        </tr>

                        <tr>
                            <td align="right">
                                <label for="confirmPassword">Re-enter Password</label>
                            </td>
                            <td>
                                <input type="password" size="35" id="confirmPassword" name="confirmPassword" minlength="8" maxlength="64" autocomplete="new-password" required placeholder="Repeat password" title="Re-enter the password to confirm it matches.">
                                <span id="confirmPassword_text"></span>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="3">
                                <div class="button-row">
                                    <input type="button" id="reviewBtn" value="Review">
                                    <input type="submit" value="Submit">
                                    <input type="reset" value="Start Over">
                                </div>
                                <br><br>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div id="reviewPanel" class="review-panel" hidden>
                    <h2>Please Review This Information</h2>
                    <div id="reviewContent"></div>
                </div>
            </form>
        </div>

        <footer class="site-footer">
            <div class="footer-inner">
                <div>
                    <p class="footer-brand">HitPoints Health</p>
                    <p>12345 Noman Road · Somewhere, TX 77890</p>
                </div>
                <a class="contact-link" href="mailto:hxkoch@cougarnet.uh.edu">Contact us</a>
            </div>
        </footer>
    </body>
</html>
